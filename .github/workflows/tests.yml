name: Tests

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'docs/getting_started.md'
      - 'skill-search/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'docs/getting_started.md'
      - 'skill-search/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run the test suite
        run: make test

      - name: Run the trace-based coverage summary
        run: make test-cov

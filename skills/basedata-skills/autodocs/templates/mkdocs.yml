# Repository-specific values are marked CHANGE. Everything else is the house configuration.
site_name: CHANGE
site_description: CHANGE, one sentence stating what the software does
site_url: https://CHANGE-org.github.io/CHANGE-repo
repo_url: https://github.com/CHANGE-org/CHANGE-repo
repo_name: CHANGE-org/CHANGE-repo
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo   # CHANGE
      accent: indigo    # CHANGE
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo   # CHANGE
      accent: indigo    # CHANGE
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]   # CHANGE to [.] for a flat layout
          options:
            docstring_style: numpy
            members_order: source
            show_root_heading: true
            show_source: false
            filters: ["!^_"]

# Delete when the repository has no collection of self-describing folders.
hooks:
  - hooks/gen_collection.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# CHANGE: one entry per capability or public module, the collection group last before the developer guide.
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Modules:
    - CHANGE: change.md
  - CLI Reference: cli.md
  - Use Cases:
    - Overview: use-cases/index.md
    # Pages for each folder are generated and appended here by hooks/gen_collection.py.
  - Developer Guide: developer.md

task: wmt-ro-en-t5-prompt-judge
dataset_path: wmt16
dataset_name: ro-en
training_split: train
validation_split: validation
output_type: generate_until
doc_to_text: "Translate from English to Romanian. English: {{translation.en}} Romanian: "
doc_to_target: "{{translation.ro}}"
generation_kwargs:
  max_gen_toks: 512
  until:
    - "\n"
    - "\n\n"
    - "|"
metric_list:
  - metric: wer
    aggregation: mean
    higher_is_better: false
  - metric: llm_judge
    aggregation: llm_judge
    name: gpt_4.1_no_reference # unique name in case you have multiple llm judges
    higher_is_better: true
    source_field1: translation
    source_field2: en
    response_format:
      score: 8.5
      accuracy: 9.0
      fluency: 8.0
      consistency: 8.0
      completeness: 9.0
      reasoning: "Good translation with minor issues."
    score_field: score
    prompt_template: |
      You are an expert translation quality evaluator. Your task is to assess the quality of a machine translation.

      Evaluate the translation based on at least these criteria:
      1. **Accuracy**: Does the translation convey the same meaning as the source text?
      2. **Fluency**: Is the translation natural and grammatically correct in the target language?
      3. **Consistency**: Are terminology and style consistent?
      4. **Completeness**: Is all information from the source text included?

      Source Text:
      {{ doc[source_field1][source_field2].strip() }}

      Model Translation:
      {{ prediction.strip() }}

      Please provide:
      1. An integer score from 0-10 (where 0 is completely wrong and 10 is perfect).
      2. A brief explanation of your scoring

      {{ response_format }}
    model: gpt-4.1
    # api_base: set via LLM_JUDGE_API_BASE env variable, e.g. LLM_JUDGE_API_BASE=my_vllm_server_host:8000/v1
    concurrency: 100 # num of concurrent threads making calls to llm judge
    temperature: 0.4 # gpt-oss generally better with non-zero temperature
    max_tokens: 3000 # gpt-oss uses thinking-mode, needs more tokens generally
    save_details: true  # Save detailed results to llm_judge_<task>_<model>_<timestamp>.jsonl (requires --output_path)
  - metric: llm_judge
    aggregation: llm_judge
    name: gpt_4.1_with_reference # unique name in case you have multiple llm judges
    higher_is_better: true
    source_field1: translation
    source_field2: en
    response_format:
      score: 8.5
      accuracy: 9.0
      fluency: 8.0
      consistency: 8.0
      completeness: 9.0
      reasoning: "Good translation with minor issues."
    score_field: score
    prompt_template: |
      You are an expert translation quality evaluator. Your task is to assess the quality of a machine translation.

      Evaluate the translation based on at least these criteria:
      1. **Accuracy**: Does the translation convey the same meaning as the source text?
      2. **Fluency**: Is the translation natural and grammatically correct in the target language?
      3. **Consistency**: Are terminology and style consistent?
      4. **Completeness**: Is all information from the source text included?

      Source Text:
      {{ doc[source_field1][source_field2].strip() }}

      Model Translation:
      {{ prediction.strip() }}

      Reference Translation:
      {{ reference }}

      Please provide:
      1. An integer score from 0-10 (where 0 is completely wrong and 10 is perfect).
      2. A brief explanation of your scoring

      {{ response_format }}
    model: gpt-4.1
    # api_base: set via LLM_JUDGE_API_BASE env variable, e.g. LLM_JUDGE_API_BASE=my_vllm_server_host:8000/v1
    concurrency: 100 # num of concurrent threads making calls to llm judge
    temperature: 0.4 # gpt-oss generally better with non-zero temperature
    max_tokens: 3000 # gpt-oss uses thinking-mode, needs more tokens generally
    save_details: true  # Save detailed results to llm_judge_<task>_<model>_<timestamp>.jsonl (requires --output_path)
metadata:
  version: 1.0
  extra_llm_judge_fields:
    source_field1: translation  # Default source field, override this in child configs, so that we can re-use the llm complete judge config from base
    source_field2: en

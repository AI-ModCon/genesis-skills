task: beamline_qa

# Local JSONL via the HuggingFace `json` loader.
# NOTE: `datasets` resolves data_files against the *current working directory*,
# not against this YAML, so the path is absolute on purpose. See plan.md.
# The `/path/to/card-eval-updater` prefix below is a placeholder: substitute the
# absolute path of your own checkout before running this config.
dataset_path: json
dataset_kwargs:
  data_files:
    test: /path/to/card-eval-updater/examples/custom-benchmark/data/beamline_qa.jsonl
dataset_name: null
test_split: test

output_type: multiple_choice

doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_choice: "{{choices}}"
doc_to_target: "{{answer_index}}"

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  # acc_norm is not optional here: data exploration found the gold answer is the
  # longest option in 16/24 items (66.7% vs 25% chance), so raw acc rewards any
  # model biased toward longer completions. Byte-length normalization controls
  # for that, and acc_norm is the number to trust.
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  description: >-
    24 four-way multiple-choice questions on synchrotron light-source science:
    accelerator physics, beamline optics, and X-ray techniques. Zero-shot.
    Random baseline 0.250; always-best-position baseline 0.333. Known artifact:
    correct answers are longer than distractors (38.8 vs 27.3 chars on average),
    so acc_norm is the honest headline metric and a high acc alone should not be
    read as domain knowledge.
